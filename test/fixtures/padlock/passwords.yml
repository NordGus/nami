  expires_at: <%= 2.months.from_now %>

# Explicit IDs preserve the chronological order used when trimming history.
older:
  id: 20
  key_digest: <%= BCrypt::Password.create "older-password" %>
  holder: luffy
  replaced_by_id: 30 # previous
  expires_at: <%= 2.months.ago %>

oldest:
  id: 10
  key_digest: <%= BCrypt::Password.create "oldest-password" %>
  holder: luffy
  replaced_by_id: 20 # older
  expires_at: <%= 3.months.ago %>
