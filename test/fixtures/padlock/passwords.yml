one:
  id: 40
  key_digest: <%= BCrypt::Password.create "password" %>
  holder: luffy
  expires_at: <%= 2.months.from_now %>

two:
  id: 50
  key_digest: <%= BCrypt::Password.create "password" %>
  holder: nami
  expires_at: <%= 2.months.from_now %>

previous:
  id: 30
  key_digest: <%= BCrypt::Password.create "previous-password" %>
  holder: luffy
